<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Glow Lash Studio — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <svg class="login-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M12 26 Q24 16 36 26" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M18 24.5 L16 20.5 M24 23 L24 18.5 M30 24.5 L32 20.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <h1 class="login-title">Glow</h1>
      <p class="login-sub">Lash Studio &middot; Admin</p>
    </div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" autocomplete="username" value="admin@glowlashstudio.com" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="login-error" role="alert" hidden>That email isn’t recognized. Try admin@glowlashstudio.com.</p>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      <p class="login-hint">Prototype login — use <strong>admin@glowlashstudio.com</strong> with any password.</p>
    </form>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg class="sidebar-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M12 26 Q24 16 36 26" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M18 24.5 L16 20.5 M24 23 L24 18.5 M30 24.5 L32 20.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <div>
        <span class="sidebar-name">Glow</span>
        <span class="sidebar-tag">Admin</span>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Admin sections">
      <button type="button" class="nav-item" data-view="overview" aria-current="page">
        <span class="nav-glyph" aria-hidden="true">◈</span> Overview
      </button>
      <button type="button" class="nav-item" data-view="appointments">
        <span class="nav-glyph" aria-hidden="true">◷</span> Appointments
      </button>
      <button type="button" class="nav-item" data-view="customers">
        <span class="nav-glyph" aria-hidden="true">◉</span> Customers
      </button>
      <button type="button" class="nav-item" data-view="staff">
        <span class="nav-glyph" aria-hidden="true">✦</span> Staff
      </button>
      <button type="button" class="nav-item" data-view="analytics">
        <span class="nav-glyph" aria-hidden="true">◭</span> Analytics
      </button>
      <button type="button" class="nav-item" data-view="marketing">
        <span class="nav-glyph" aria-hidden="true">✉</span> Marketing
      </button>
      <button type="button" class="nav-item" data-view="forms">
        <span class="nav-glyph" aria-hidden="true">✎</span> Forms
      </button>
    </nav>

    <div class="sidebar-foot">
      <p class="sidebar-user">Signed in as<br><strong>admin@glowlashstudio.com</strong></p>
      <button type="button" id="logout-btn" class="btn btn-ghost-light">Sign out</button>
    </div>
  </aside>

  <main class="main" id="main-content">
    <header class="topbar">
      <h2 id="view-title" class="view-title">Overview</h2>
      <span class="topbar-date" id="topbar-date"></span>
    </header>
    <div id="view" class="view" tabindex="-1"></div>
  </main>
</div>

<!-- ============ DRAWER ============ -->
<div id="drawer-overlay" class="overlay" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <h3 id="drawer-title"></h3>
    <button type="button" class="icon-btn" id="drawer-close" aria-label="Close panel">×</button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<!-- ============ MODAL ============ -->
<div id="modal-overlay" class="overlay" hidden></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="modal-head">
    <h3 id="modal-title"></h3>
    <button type="button" class="icon-btn" id="modal-close" aria-label="Close dialog">×</button>
  </div>
  <div id="modal-body" class="modal-body"></div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
